<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>KI Übersetzer</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --accent:  #6366f1;
      --accent2: #818cf8;
      --bg:      #0a0a0f;
      --card:    #16161f;
      --border:  #2a2a3a;
      --text:    #e2e8f0;
      --muted:   #64748b;
      --success: #22c55e;
    }
    html, body {
      height: 100%; background: #000;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      overflow: hidden;
    }

    /* ═══ KAMERA ════════════════════════════════════════════ */
    #cameraScreen { position: fixed; inset: 0; z-index: 1; }
    #video { width: 100%; height: 100%; object-fit: cover; display: block; }
    #canvas { display: none; }

    .guide { position: absolute; inset: 0; pointer-events: none; }
    .guide::before, .guide::after, .guide .c::before, .guide .c::after {
      content: ''; position: absolute; width: 28px; height: 28px;
      border-color: rgba(255,255,255,.6); border-style: solid;
    }
    .guide::before  { top: 60px; left: 20px; border-width: 2px 0 0 2px; border-radius: 3px 0 0 0; }
    .guide::after   { top: 60px; right: 20px; border-width: 2px 2px 0 0; border-radius: 0 3px 0 0; }
    .guide .c::before { bottom: 120px; left: 20px; border-width: 0 0 2px 2px; border-radius: 0 0 0 3px; }
    .guide .c::after  { bottom: 120px; right: 20px; border-width: 0 2px 2px 0; border-radius: 0 0 3px 0; }

    .flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; transition: opacity .05s; }
    .flash.on { opacity: .65; }
    .scan-line {
      position: absolute; left: 0; right: 0; height: 2px; display: none;
      background: linear-gradient(90deg, transparent, var(--accent2), transparent);
      animation: scan 1.3s ease-in-out infinite;
    }
    @keyframes scan { 0%,100% { top: 8%; } 50% { top: 86%; } }

    .shutter-bar {
      position: absolute; bottom: 0; left: 0; right: 0;
      display: flex; align-items: center; justify-content: center; gap: 40px;
      padding: 18px 32px; padding-bottom: max(22px, env(safe-area-inset-bottom));
      background: linear-gradient(to top, rgba(0,0,0,.75) 55%, transparent);
    }
    .btn-shutter {
      width: 74px; height: 74px; border-radius: 50%;
      background: #fff; border: 4px solid rgba(255,255,255,.35);
      box-shadow: 0 0 0 3px var(--accent), 0 6px 28px rgba(0,0,0,.55);
      cursor: pointer; font-size: 26px;
      display: flex; align-items: center; justify-content: center;
      transition: transform .1s; flex-shrink: 0;
    }
    .btn-shutter:active { transform: scale(.88); }
    .btn-shutter:disabled { opacity: .35; cursor: default; transform: none; }
    .btn-round {
      width: 50px; height: 50px; border-radius: 50%;
      background: rgba(255,255,255,.15); backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,.2);
      color: #fff; font-size: 20px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .btn-round:active { background: rgba(255,255,255,.3); }

    .cam-error {
      position: absolute; inset: 0; display: none;
      flex-direction: column; align-items: center; justify-content: center;
      gap: 12px; padding: 32px; text-align: center; background: #000;
    }
    .cam-error.on { display: flex; }

    /* ═══ ERGEBNIS-SCREEN ═══════════════════════════════════ */
    #resultScreen {
      position: fixed; inset: 0; z-index: 200;
      display: none; flex-direction: column;
      background: var(--bg);
      overflow-y: scroll; -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      animation: slideUp .22s ease;
    }
    #resultScreen.open { display: flex; }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

    /* Sticky Header */
    .result-topbar {
      position: sticky; top: 0; z-index: 10;
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 14px; padding-top: max(10px, env(safe-area-inset-top));
      background: rgba(10,10,15,.95); backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border); flex-shrink: 0;
    }
    .btn-back {
      background: var(--card); border: 1px solid var(--border);
      color: var(--text); padding: 7px 14px; border-radius: 20px;
      font-size: 14px; font-weight: 600; cursor: pointer;
      display: flex; align-items: center; gap: 5px;
    }
    .btn-back:active { background: var(--border); }
    .lang-pill {
      background: rgba(99,102,241,.18); border: 1px solid rgba(99,102,241,.35);
      color: var(--accent2); font-size: 11px; font-weight: 700;
      text-transform: uppercase; letter-spacing: .5px;
      padding: 5px 12px; border-radius: 20px;
    }

    /* Übersetztes Bild */
    #translatedCanvas {
      width: 100%; display: block;
      background: #000;
    }

    /* Ladeoverlay über Bild */
    .img-loading {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 14px; padding: 60px 20px;
      background: var(--bg);
    }
    .spinner {
      width: 44px; height: 44px;
      border: 3px solid var(--border); border-top-color: var(--accent2);
      border-radius: 50%; animation: spin .75s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Original-Text-Liste */
    .original-section {
      padding: 16px 14px; padding-bottom: max(32px, env(safe-area-inset-bottom));
    }
    .orig-header {
      font-size: 10px; font-weight: 700; text-transform: uppercase;
      letter-spacing: .8px; color: var(--muted); margin-bottom: 10px;
    }
    .orig-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 14px; overflow: hidden;
    }
    .orig-row {
      display: grid; grid-template-columns: 1fr 1fr; gap: 0;
      padding: 12px 14px; border-bottom: 1px solid var(--border);
    }
    .orig-row:last-child { border-bottom: none; }
    .orig-left {
      font-size: 13px; color: var(--muted); padding-right: 10px;
      border-right: 1px solid var(--border); line-height: 1.4;
    }
    .orig-right {
      font-size: 13px; color: var(--text); font-weight: 500;
      padding-left: 10px; line-height: 1.4;
    }
    .copy-all-btn {
      width: 100%; margin-top: 10px;
      background: var(--card); border: 1px solid var(--border);
      color: var(--muted); padding: 10px; border-radius: 10px;
      font-size: 13px; cursor: pointer;
    }
    .copy-all-btn.ok { color: var(--success); border-color: var(--success); }

    .msg-box {
      margin: 16px; padding: 18px; border-radius: 14px;
      font-size: 14px; text-align: center; line-height: 1.5;
    }
    .msg-box.error { background: rgba(239,68,68,.1); border: 1px solid rgba(239,68,68,.3); color: #fca5a5; }
    .msg-box.info  { background: var(--card); border: 1px solid var(--border); color: var(--muted); }
  </style>
</head>
<body>

<!-- Kamera -->
<div id="cameraScreen">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>
  <div class="guide"><div class="c"></div></div>
  <div class="flash" id="flash"></div>
  <div class="scan-line" id="scanLine"></div>
  <div class="cam-error" id="camError">
    <div style="font-size:48px">📷</div>
    <div style="font-weight:600;font-size:16px;color:#fff">Kamera nicht verfügbar</div>
    <div style="color:var(--muted);font-size:13px;line-height:1.6">
      Bitte erlaube den Kamerazugriff.<br>iPhone: Einstellungen → Safari → Kamera → Erlauben
    </div>
    <button onclick="startCamera()"
      style="margin-top:10px;background:var(--accent);color:#fff;border:none;padding:10px 22px;border-radius:10px;font-size:14px;cursor:pointer">
      Nochmal versuchen
    </button>
  </div>
  <div class="shutter-bar">
    <button class="btn-round" onclick="flipCamera()">🔄</button>
    <button class="btn-shutter" id="btnCapture" onclick="capture()">📸</button>
    <div style="width:50px"></div>
  </div>
</div>

<!-- Ergebnis -->
<div id="resultScreen">
  <div class="result-topbar">
    <button class="btn-back" onclick="closeResult()">← Kamera</button>
    <div class="lang-pill" id="langPill" style="visibility:hidden">…</div>
  </div>

  <!-- Bild mit eingemalter Übersetzung ODER Ladeanimation -->
  <div id="imageArea">
    <div class="img-loading">
      <div class="spinner"></div>
      <div style="color:var(--muted);font-size:14px">KI übersetzt…</div>
    </div>
  </div>

  <!-- Originaltexte + Übersetzungen als Liste -->
  <div id="textList"></div>
</div>

<script>
  let stream = null;
  let facingMode = 'environment';

  // ── Kamera ──────────────────────────────────────────────────
  async function startCamera() {
    document.getElementById('camError').classList.remove('on');
    try {
      if (stream) stream.getTracks().forEach(t => t.stop());
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: facingMode }, width: { ideal: 1920 } },
        audio: false,
      });
      document.getElementById('video').srcObject = stream;
    } catch {
      document.getElementById('camError').classList.add('on');
    }
  }

  function flipCamera() {
    facingMode = facingMode === 'environment' ? 'user' : 'environment';
    startCamera();
  }

  // ── Aufnehmen ───────────────────────────────────────────────
  async function capture() {
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const btn = document.getElementById('btnCapture');
    if (!stream) return;

    // Blitz
    const fl = document.getElementById('flash');
    fl.classList.add('on');
    setTimeout(() => fl.classList.remove('on'), 130);

    // Frame auf Canvas zeichnen
    canvas.width  = video.videoWidth  || 640;
    canvas.height = video.videoHeight || 480;
    canvas.getContext('2d').drawImage(video, 0, 0);
    const imageData = resizeCanvas(canvas, 1100);

    // Ergebnis-Screen sofort anzeigen (mit Spinner)
    document.getElementById('langPill').style.visibility = 'hidden';
    document.getElementById('imageArea').innerHTML = `
      <div class="img-loading">
        <div class="spinner"></div>
        <div style="color:var(--muted);font-size:14px">KI übersetzt…</div>
      </div>`;
    document.getElementById('textList').innerHTML = '';
    const rs = document.getElementById('resultScreen');
    rs.classList.add('open');
    rs.scrollTop = 0;

    btn.disabled = true;
    document.getElementById('scanLine').style.display = 'block';

    try {
      const res  = await fetch('/api/translate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ image: imageData }),
      });
      const data = await res.json();
      await renderResult(data, imageData);
    } catch (e) {
      document.getElementById('imageArea').innerHTML =
        `<div class="msg-box error">⚠️ Netzwerkfehler: ${esc(e.message)}</div>`;
    } finally {
      btn.disabled = false;
      document.getElementById('scanLine').style.display = 'none';
    }
  }

  // ── Ergebnis rendern ────────────────────────────────────────
  async function renderResult(data, imageDataUrl) {
    if (!data.success) {
      document.getElementById('imageArea').innerHTML =
        `<div class="msg-box error">⚠️ ${esc(data.error || 'Fehler')}</div>`;
      return;
    }
    if (data.kein_text || !data.blocks || data.blocks.length === 0) {
      document.getElementById('imageArea').innerHTML =
        `<div class="msg-box info">🔍 Kein Text erkannt – näher ran halten und nochmal probieren.</div>`;
      return;
    }

    // Sprache anzeigen
    const pill = document.getElementById('langPill');
    pill.textContent = `🌍 ${esc(data.sprache || '?')} → Deutsch`;
    pill.style.visibility = 'visible';

    // Canvas mit Übersetzung rendern
    const translatedDataUrl = await paintTranslation(imageDataUrl, data.blocks);

    // Bild einsetzen
    document.getElementById('imageArea').innerHTML =
      `<img id="translatedCanvas" src="${translatedDataUrl}" alt="Übersetztes Bild">`;

    // Tabelle Original ↔ Deutsch
    const rows = data.blocks.map(b => `
      <div class="orig-row">
        <div class="orig-left">${esc(b.original)}</div>
        <div class="orig-right">${esc(b.deutsch)}</div>
      </div>`).join('');

    const allDeutsch = data.blocks.map(b => b.deutsch).join('\n');

    document.getElementById('textList').innerHTML = `
      <div class="original-section">
        <div class="orig-header">Original → Deutsch</div>
        <div class="orig-card">${rows}</div>
        <button class="copy-all-btn" onclick="copyAll(this,${JSON.stringify(allDeutsch)})">
          Gesamte Übersetzung kopieren
        </button>
      </div>`;
  }

  // ── Canvas-Übersetzung ──────────────────────────────────────
  function paintTranslation(imageDataUrl, blocks) {
    return new Promise(resolve => {
      const img = new Image();
      img.onload = () => {
        const c = document.createElement('canvas');
        c.width  = img.width;
        c.height = img.height;
        const ctx = c.getContext('2d');
        ctx.drawImage(img, 0, 0);

        for (const block of blocks) {
          const x = Math.round(block.x      / 100 * img.width);
          const y = Math.round(block.y      / 100 * img.height);
          const w = Math.round(block.breite / 100 * img.width);
          const h = Math.round(block.hoehe  / 100 * img.height);
          if (w < 6 || h < 6) continue;

          // Hintergrundfarbe sampeln und Originaltextfläche übermalen
          const [r, g, b] = sampleColor(ctx, x, y, w, h);
          const bright = (r * 299 + g * 587 + b * 114) / 1000;
          const textCol = bright > 140 ? '#111' : '#fff';

          ctx.fillStyle = `rgb(${r},${g},${b})`;
          ctx.fillRect(x - 2, y - 2, w + 4, h + 4);

          // Deutschen Text passgenau einmalen
          ctx.fillStyle = textCol;
          ctx.textBaseline = 'middle';
          drawFittedText(ctx, block.deutsch, x, y, w, h);
        }

        resolve(c.toDataURL('image/jpeg', 0.92));
      };
      img.onerror = () => resolve(imageDataUrl);
      img.src = imageDataUrl;
    });
  }

  // Text so groß wie möglich einpassen — gleiche Höhe wie Original
  function drawFittedText(ctx, text, x, y, w, h) {
    // Zielgröße: Boxhöhe × 0.82 (entspricht cap-height des Originals)
    let fs = Math.max(8, Math.round(h * 0.82));

    ctx.font = `600 ${fs}px -apple-system, Arial, sans-serif`;

    // Passt auf eine Zeile?
    if (ctx.measureText(text).width <= w) {
      ctx.fillText(text, x, y + h / 2);
      return;
    }

    // Zeilenumbruch bei Zielgröße versuchen
    let lines = breakLines(ctx, text, w);
    const totalH = lines.length * fs * 1.25;
    if (totalH <= h * 1.6) {
      const lineH = fs * 1.25;
      const startY = y + (h - totalH) / 2 + fs / 2;
      lines.forEach((l, i) => ctx.fillText(l, x, startY + i * lineH));
      return;
    }

    // Schriftgröße schrittweise verkleinern bis Text in Box passt
    for (fs = fs - 1; fs >= 7; fs--) {
      ctx.font = `600 ${fs}px -apple-system, Arial, sans-serif`;
      lines = breakLines(ctx, text, w);
      const th = lines.length * fs * 1.25;
      if (th <= h * 1.6) {
        const lineH = fs * 1.25;
        const startY = y + (h - th) / 2 + fs / 2;
        lines.forEach((l, i) => ctx.fillText(l, x, startY + i * lineH));
        return;
      }
    }

    // Letzter Ausweg: kleinste Größe, einfach zeichnen
    ctx.font = '600 7px -apple-system, Arial, sans-serif';
    ctx.fillText(text, x, y + h / 2);
  }

  // Text in Zeilen aufteilen die in maxW passen
  function breakLines(ctx, text, maxW) {
    const words = text.split(' ');
    const lines = [];
    let line = '';
    for (const word of words) {
      const test = line ? line + ' ' + word : word;
      if (ctx.measureText(test).width > maxW && line) {
        lines.push(line); line = word;
      } else { line = test; }
    }
    if (line) lines.push(line);
    return lines;
  }

  // Durchschnittliche Pixelfarbe in einer Region sampeln
  function sampleColor(ctx, x, y, w, h) {
    try {
      const sx = Math.max(0, x), sy = Math.max(0, y);
      const sw = Math.min(w, ctx.canvas.width  - sx);
      const sh = Math.min(h, ctx.canvas.height - sy);
      if (sw < 1 || sh < 1) return [235, 235, 220];
      const d = ctx.getImageData(sx, sy, sw, sh).data;
      let r = 0, g = 0, b = 0, n = 0;
      for (let i = 0; i < d.length; i += 16) { r += d[i]; g += d[i+1]; b += d[i+2]; n++; }
      return n ? [Math.round(r/n), Math.round(g/n), Math.round(b/n)] : [235, 235, 220];
    } catch { return [235, 235, 220]; }
  }

  // ── Hilfsfunktionen ─────────────────────────────────────────
  function closeResult() {
    document.getElementById('resultScreen').classList.remove('open');
  }

  async function copyAll(btn, text) {
    try {
      await navigator.clipboard.writeText(text);
      btn.textContent = 'Kopiert ✓'; btn.classList.add('ok');
      setTimeout(() => { btn.textContent = 'Gesamte Übersetzung kopieren'; btn.classList.remove('ok'); }, 2000);
    } catch {}
  }

  function resizeCanvas(canvas, maxW) {
    if (canvas.width <= maxW) return canvas.toDataURL('image/jpeg', 0.82);
    const s = maxW / canvas.width;
    const t = document.createElement('canvas');
    t.width = maxW; t.height = Math.round(canvas.height * s);
    t.getContext('2d').drawImage(canvas, 0, 0, t.width, t.height);
    return t.toDataURL('image/jpeg', 0.82);
  }

  function esc(s) {
    return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  startCamera();
</script>
</body>
</html>
