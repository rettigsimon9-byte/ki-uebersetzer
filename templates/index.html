<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>KI Übersetzer</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --accent:  #6366f1;
      --accent2: #818cf8;
      --success: #22c55e;
      --text:    #e2e8f0;
      --muted:   #94a3b8;
      --card-bg: rgba(10,10,20,.82);
      --radius:  16px;
    }

    html, body {
      height: 100%; width: 100%;
      background: #000;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      overflow: hidden;
    }

    /* ── Camera fullscreen ──────────────────────────────────── */
    #video {
      position: fixed;
      inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      z-index: 1;
    }
    #canvas { display: none; }

    /* Corner guides */
    .guide {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
    }
    .guide::before, .guide::after,
    .guide .c::before, .guide .c::after {
      content: '';
      position: absolute;
      width: 28px; height: 28px;
      border-color: rgba(255,255,255,.65);
      border-style: solid;
    }
    .guide::before  { top: 60px; left: 20px; border-width: 2px 0 0 2px; border-radius: 4px 0 0 0; }
    .guide::after   { top: 60px; right: 20px; border-width: 2px 2px 0 0; border-radius: 0 4px 0 0; }
    .guide .c::before { bottom: 110px; left: 20px; border-width: 0 0 2px 2px; border-radius: 0 0 0 4px; }
    .guide .c::after  { bottom: 110px; right: 20px; border-width: 0 2px 2px 0; border-radius: 0 0 4px 0; }

    /* Flash */
    .flash {
      position: fixed; inset: 0; z-index: 50;
      background: #fff; opacity: 0;
      pointer-events: none; transition: opacity .05s;
    }
    .flash.on { opacity: .7; }

    /* Scan bar */
    .scan-bar {
      position: fixed; left: 0; right: 0; height: 2px; z-index: 3;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      display: none;
      animation: scan 1.2s ease-in-out infinite;
    }
    @keyframes scan { 0%,100% { top: 8%; } 50% { top: 88%; } }
    .scanning .scan-bar { display: block; }

    /* Camera error */
    .cam-error {
      position: fixed; inset: 0; z-index: 5;
      display: none; flex-direction: column; align-items: center;
      justify-content: center; gap: 12px; padding: 32px;
      text-align: center; background: #000;
    }
    .cam-error.visible { display: flex; }

    /* ── Shutter bar ─────────────────────────────────────────── */
    .shutter-bar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 40px;
      padding: 16px 32px;
      padding-bottom: max(20px, env(safe-area-inset-bottom));
      background: linear-gradient(to top, rgba(0,0,0,.7) 60%, transparent);
    }
    .btn-shutter {
      width: 72px; height: 72px;
      border-radius: 50%;
      background: #fff;
      border: 4px solid rgba(255,255,255,.4);
      box-shadow: 0 0 0 3px var(--accent), 0 4px 24px rgba(0,0,0,.6);
      cursor: pointer;
      font-size: 26px;
      display: flex; align-items: center; justify-content: center;
      transition: transform .1s;
      flex-shrink: 0;
    }
    .btn-shutter:active  { transform: scale(.88); }
    .btn-shutter:disabled { opacity: .35; cursor: default; transform: none; }
    .btn-round {
      width: 48px; height: 48px; border-radius: 50%;
      background: rgba(255,255,255,.15);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,.2);
      color: #fff; font-size: 20px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .btn-round:active { background: rgba(255,255,255,.3); }

    /* ── Result screen (fullscreen photo + overlay) ──────────── */
    #resultScreen {
      display: none;
      position: fixed;
      inset: 0; z-index: 100;
      flex-direction: column;
    }
    #resultScreen.open { display: flex; }

    /* Photo background */
    #resultPhoto {
      position: absolute;
      inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
    }

    /* Dark gradient at bottom for readability */
    .photo-gradient {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      height: 70%;
      background: linear-gradient(to top, rgba(0,0,0,.92) 40%, transparent);
      pointer-events: none;
    }

    /* Top bar over photo */
    .result-topbar {
      position: relative; z-index: 2;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      padding-top: max(12px, env(safe-area-inset-top));
    }
    .btn-back {
      background: rgba(0,0,0,.5);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,.15);
      color: #fff;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex; align-items: center; gap: 6px;
    }
    .btn-back:active { background: rgba(0,0,0,.7); }
    .lang-badge {
      background: rgba(99,102,241,.25);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(99,102,241,.4);
      color: var(--accent2);
      font-size: 11px; font-weight: 700;
      text-transform: uppercase; letter-spacing: .5px;
      padding: 5px 12px; border-radius: 20px;
    }

    /* Spacer pushes content down */
    .result-spacer { flex: 1; position: relative; z-index: 2; }

    /* Translation box at bottom */
    .translation-box {
      position: relative; z-index: 2;
      padding: 0 16px;
      padding-bottom: max(24px, env(safe-area-inset-bottom));
    }
    .translation-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .tr-section {
      padding: 14px 16px;
    }
    .tr-section + .tr-section {
      border-top: 1px solid rgba(255,255,255,.08);
    }
    .tr-label {
      font-size: 10px; font-weight: 700;
      text-transform: uppercase; letter-spacing: .8px;
      color: var(--muted); margin-bottom: 6px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .tr-text {
      font-size: 16px; line-height: 1.5;
      white-space: pre-wrap; word-break: break-word;
      color: #fff; font-weight: 500;
    }
    .tr-orig {
      font-size: 13px; line-height: 1.45;
      color: var(--muted); white-space: pre-wrap; word-break: break-word;
    }
    .btn-copy {
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.15);
      color: var(--muted);
      font-size: 11px; padding: 3px 10px;
      border-radius: 6px; cursor: pointer;
    }
    .btn-copy.ok { color: var(--success); border-color: var(--success); }

    /* Loading overlay over photo */
    .loading-overlay {
      position: absolute; inset: 0; z-index: 3;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 14px;
      background: rgba(0,0,0,.45);
      backdrop-filter: blur(2px);
    }
    .spinner {
      width: 44px; height: 44px;
      border: 3px solid rgba(255,255,255,.2);
      border-top-color: var(--accent2);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-label { font-size: 14px; color: #fff; font-weight: 500; }

    /* Error inside result screen */
    .error-box {
      background: rgba(239,68,68,.15);
      border: 1px solid rgba(239,68,68,.3);
      border-radius: var(--radius);
      padding: 16px;
      font-size: 14px; color: #fca5a5;
    }

    /* No-text box */
    .notext-box {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: var(--radius);
      padding: 20px; text-align: center;
      font-size: 14px; color: var(--muted);
    }
  </style>
</head>
<body>

<!-- Live camera -->
<video id="video" autoplay playsinline muted></video>
<canvas id="canvas"></canvas>
<div class="guide"><div class="c"></div></div>
<div class="scan-bar" id="scanBar"></div>
<div class="flash" id="flash"></div>

<div class="cam-error" id="camError">
  <div style="font-size:48px">📷</div>
  <div style="font-size:16px;font-weight:600">Kamera nicht verfügbar</div>
  <div style="color:var(--muted);font-size:14px;line-height:1.5">
    Bitte erlaube den Kamera-Zugriff.<br><br>
    iPhone: Einstellungen → Safari → Kamera → Erlauben
  </div>
  <button onclick="startCamera()" style="margin-top:8px;background:var(--accent);color:#fff;border:none;padding:10px 20px;border-radius:10px;font-size:14px;cursor:pointer">
    Nochmal versuchen
  </button>
</div>

<!-- Shutter bar -->
<div class="shutter-bar">
  <button class="btn-round" onclick="flipCamera()">🔄</button>
  <button class="btn-shutter" id="btnCapture" onclick="capture()">📸</button>
  <div style="width:48px"></div>
</div>

<!-- Result screen (fullscreen) -->
<div id="resultScreen">
  <img id="resultPhoto" src="" alt="">
  <div class="photo-gradient"></div>
  <div id="loadingOverlay" class="loading-overlay" style="display:none">
    <div class="spinner"></div>
    <div class="loading-label">KI übersetzt…</div>
  </div>

  <div class="result-topbar">
    <button class="btn-back" onclick="closeResult()">← Kamera</button>
    <div class="lang-badge" id="langBadge" style="display:none"></div>
  </div>

  <div class="result-spacer"></div>

  <div class="translation-box" id="translationBox"></div>
</div>

<script>
  let stream = null;
  let facingMode = 'environment';

  // ── Camera ──────────────────────────────────────────────────
  async function startCamera() {
    document.getElementById('camError').classList.remove('visible');
    try {
      if (stream) stream.getTracks().forEach(t => t.stop());
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: facingMode }, width: { ideal: 1920 } },
        audio: false,
      });
      document.getElementById('video').srcObject = stream;
    } catch (e) {
      document.getElementById('camError').classList.add('visible');
    }
  }

  function flipCamera() {
    facingMode = facingMode === 'environment' ? 'user' : 'environment';
    startCamera();
  }

  // ── Capture ─────────────────────────────────────────────────
  async function capture() {
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const btn = document.getElementById('btnCapture');
    if (!stream) return;

    // Flash
    const fl = document.getElementById('flash');
    fl.classList.add('on');
    setTimeout(() => fl.classList.remove('on'), 120);

    // Draw frame
    canvas.width  = video.videoWidth  || 640;
    canvas.height = video.videoHeight || 480;
    canvas.getContext('2d').drawImage(video, 0, 0);

    // Resize to max 1100px to speed up API
    const imageData = resizeCanvas(canvas, 1100);

    // Show result screen with photo + loading
    document.getElementById('resultPhoto').src = imageData;
    document.getElementById('langBadge').style.display = 'none';
    document.getElementById('translationBox').innerHTML = '';
    document.getElementById('loadingOverlay').style.display = 'flex';
    document.getElementById('resultScreen').classList.add('open');

    btn.disabled = true;
    document.getElementById('scanBar').style.display = 'block';

    try {
      const res  = await fetch('/api/translate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ image: imageData }),
      });
      const data = await res.json();
      showResult(data);
    } catch (e) {
      showError('Netzwerkfehler: ' + e.message);
    } finally {
      btn.disabled = false;
      document.getElementById('scanBar').style.display = 'none';
      document.getElementById('loadingOverlay').style.display = 'none';
    }
  }

  function resizeCanvas(canvas, maxW) {
    if (canvas.width <= maxW) return canvas.toDataURL('image/jpeg', 0.82);
    const scale = maxW / canvas.width;
    const tmp = document.createElement('canvas');
    tmp.width  = maxW;
    tmp.height = Math.round(canvas.height * scale);
    tmp.getContext('2d').drawImage(canvas, 0, 0, tmp.width, tmp.height);
    return tmp.toDataURL('image/jpeg', 0.82);
  }

  // ── Result rendering ─────────────────────────────────────────
  function showResult(data) {
    if (!data.success) { showError(data.error || 'Fehler'); return; }

    if (data.kein_text) {
      document.getElementById('translationBox').innerHTML =
        `<div class="notext-box">🔍 Kein Text erkannt – näher ran halten</div>`;
      return;
    }

    const badge = document.getElementById('langBadge');
    badge.textContent = `🌍 ${esc(data.erkannte_sprache || '?')} → Deutsch`;
    badge.style.display = '';

    document.getElementById('translationBox').innerHTML = `
      <div class="translation-card">
        <div class="tr-section">
          <div class="tr-label">
            Deutsche Übersetzung
            <button class="btn-copy" id="copyBtn" onclick="copyText(this, ${JSON.stringify(data.uebersetzung)})">Kopieren</button>
          </div>
          <div class="tr-text">${esc(data.uebersetzung)}</div>
        </div>
        <div class="tr-section">
          <div class="tr-label">Original</div>
          <div class="tr-orig">${esc(data.original)}</div>
        </div>
      </div>`;
  }

  function showError(msg) {
    document.getElementById('translationBox').innerHTML =
      `<div class="error-box">⚠️ ${esc(msg)}</div>`;
  }

  function closeResult() {
    document.getElementById('resultScreen').classList.remove('open');
  }

  // ── Helpers ──────────────────────────────────────────────────
  async function copyText(btn, text) {
    try {
      await navigator.clipboard.writeText(text);
      btn.textContent = 'Kopiert ✓';
      btn.classList.add('ok');
      setTimeout(() => { btn.textContent = 'Kopieren'; btn.classList.remove('ok'); }, 2000);
    } catch {}
  }

  function esc(s) {
    return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  startCamera();
</script>
</body>
</html>
